plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.promptstudio'
version = '0.0.1-SNAPSHOT'
description = 'prompt.practice backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    // 릴레이 게임의 서버 권위 채널. 게임 상태(턴 순서·진행 단계·채점 결과)를 밀어주고,
    // WebRTC 시그널링(SDP·ICE) 중계도 같은 소켓을 쓴다.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    // 실호출 하네스는 과금되므로 일반 테스트에서 뺀다.
    useJUnitPlatform {
        excludeTags 'llm'
    }
}

/**
 * 실제 모델을 부르는 측정 하네스만 돌린다. 통과·실패를 판정하지 않고 숫자를 stdout과
 * build/llm-harness/<phase>.jsonl에 남기므로 출력을 그대로 흘려보내고 캐시도 쓰지 않는다.
 *
 *   set -a; . ../.env; set +a
 *   sh gradlew llmTest -PllmPhase=A -PllmReps=3
 */
tasks.register('llmTest', Test) {
    group = 'verification'
    description = '실제 LLM을 불러 피드백 응답 지표를 잰다. OPENAI_API_KEY가 없으면 스킵된다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'llm'
    }

    systemProperty 'llmPhase', project.findProperty('llmPhase') ?: '0'
    systemProperty 'llmReps', project.findProperty('llmReps') ?: '1'

    testLogging {
        showStandardStreams = true
    }

    outputs.upToDateWhen { false }
}
