spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  sql:
    init:
      mode: always
  jooq:
    sql-dialect: POSTGRES
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        prefetch: 1
        # 워커가 run.result를 발행하기 전에 백엔드가 떠도 죽지 않고 재시도한다.
        missing-queues-fatal: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CODE_MODEL:gpt-5.6-luna}
        timeout: 6m
        max-retries: 2
    model:
      embedding: none

# LLM 단가표. 값은 100만 토큰당 USD다. 등록되지 않은 모델은 비용을 NULL로 남기고 warn 로그를 남긴다
# — 모르는 단가를 0으로 적으면 합계가 거짓말이 된다.
#
# 실제 단가를 팀이 확정해 채운다. 모델명에 점이 있어 대괄호 키가 필수다:
#   models:
#     "[gpt-5.6-luna]": { input: 1.25, cached-input: 0.125, output: 10.0 }
#
# 값을 비운 채 키만 남기면 애플리케이션이 기동하지 못한다. YAML의 빈 값은 빈 문자열로 실려
# String을 Map으로 바꿀 컨버터가 없어 바인딩이 실패한다 — `models: {}`도 같은 이유로 실패한다.
# 단가를 전부 없앨 거면 llm 블록을 통째로 지운다.
llm:
  pricing:
    models:
      "[gpt-5.6-luna]": { input: 1.25, cached-input: 0.125, output: 10.0 }

server:
  port: 9090

guest:
  session:
    # 개발 단계에서는 게스트 풀이를 한 시간만 유지한다.
    ttl: ${GUEST_SESSION_TTL:PT1H}
    cookie-name: GUEST_SESSION
    # HTTPS 역프록시 배포 환경에서는 true로 설정한다.
    secure: ${GUEST_COOKIE_SECURE:false}

# 콘솔은 사람이 docker logs로 읽고, 파일은 기계가 jq로 읽는다.
logging:
  file:
    # 이 값이 없으면 file appender 자체가 생기지 않아 아래 structured.format.file이 조용히 무동작한다.
    #
    # 기본값은 로컬 기준이다. 로컬은 백엔드를 컨테이너로 띄우지 않고 호스트에서 직접 돌리므로
    # 컨테이너 경로(/var/log/app)가 기본값이면 아무도 보지 않는 곳에 로그가 쌓인다 —
    # 윈도우에서는 이 경로가 드라이브 루트로 해석돼 C:\var\log\app 에 조용히 생긴다(실측).
    #
    # 상대 경로는 작업 디렉터리 기준이고, 그건 항상 backend/ 다 — 위 spring.config.import가
    # ../.env 를 읽는 것이 그 전제이기 때문이다. 즉 backend/logs/backend.log 에 쓴다.
    #
    # 배포는 docker-compose.backend.yml이 LOG_FILE=/var/log/app/backend.log 로 못 박고
    # 그 디렉터리를 호스트에 바인드 마운트한다. 배포가 이 기본값에 의존하지 않으므로
    # 여기를 로컬 친화적으로 두어도 배포 경로는 흔들리지 않는다.
    name: ${LOG_FILE:./logs/backend.log}
  structured:
    format:
      # console은 지정하지 않아 평문을 유지한다.
      file: ecs
    json:
      context:
        # MDC·KVP 키가 ECS 예약어(message·log·error·tags 등)와 충돌하면 예외가 나고
        # 같은 스레드의 다음 로그 한 줄까지 깨진 JSON이 된다. app.* 아래로 내려 원천 차단한다.
        prefix: app
  pattern:
    # %msg는 KeyValuePair를 받지 않는다. %kvp를 빼면 콘솔에서 필드가 통째로 사라진다.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:-} --- [%thread] [req:%X{requestId:-}] %logger{39} : %msg %kvp%n"
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
      # 기본값 0B는 무제한이다. 디스크를 묶으려면 반드시 지정해야 한다.
      total-size-cap: 2GB

app:
  cors:
    # 브라우저가 붙이는 Origin 헤더가 이 목록에 없으면 403 "Invalid CORS request"가 난다.
    # 배포에서 프런트가 올라가는 도메인이 바뀌면 CORS_ALLOWED_ORIGINS로 덮어쓴다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://i15a505.p.ssafy.io}
