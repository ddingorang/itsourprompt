spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  sql:
    init:
      mode: always
  jooq:
    sql-dialect: POSTGRES
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        prefetch: 1
        # 워커가 run.result를 발행하기 전에 백엔드가 떠도 죽지 않고 재시도한다.
        missing-queues-fatal: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CODE_MODEL:gpt-5.6-luna}
        timeout: 6m
        max-retries: 2
    model:
      embedding: none

# LLM 단가표. 값은 100만 토큰당 USD다. 등록되지 않은 모델은 비용을 NULL로 남기고 warn 로그를 남긴다
# — 모르는 단가를 0으로 적으면 합계가 거짓말이 된다.
#
# 실제 단가를 팀이 확정해 채운다. 모델명에 점이 있어 대괄호 키가 필수다:
#   models:
#     "[gpt-5.6-luna]": { input: 1.25, cached-input: 0.125, output: 10.0 }
llm:
  pricing:
    models:

server:
  port: 9090

guest:
  session:
    # 개발 단계에서는 게스트 풀이를 한 시간만 유지한다.
    ttl: ${GUEST_SESSION_TTL:PT1H}
    cookie-name: GUEST_SESSION
    # HTTPS 역프록시 배포 환경에서는 true로 설정한다.
    secure: ${GUEST_COOKIE_SECURE:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:-} --- [%thread] [req:%X{requestId:-}] %logger{39} : %msg%n"

app:
  cors:
    # 브라우저가 붙이는 Origin 헤더가 이 목록에 없으면 403 "Invalid CORS request"가 난다.
    # 배포에서 프런트가 올라가는 도메인이 바뀌면 CORS_ALLOWED_ORIGINS로 덮어쓴다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://i15a505.p.ssafy.io}
