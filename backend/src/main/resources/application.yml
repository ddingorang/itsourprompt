spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  sql:
    init:
      mode: always
  jooq:
    sql-dialect: POSTGRES
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        prefetch: 1
        # 워커가 run.result를 발행하기 전에 백엔드가 떠도 죽지 않고 재시도한다.
        missing-queues-fatal: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CODE_MODEL:gpt-5.6-luna}
        timeout: 6m
        max-retries: 2
    model:
      embedding: none

server:
  port: 9090

app:
  cors:
    # 브라우저가 붙이는 Origin 헤더가 이 목록에 없으면 403 "Invalid CORS request"가 난다.
    # 배포에서 프런트가 올라가는 도메인이 바뀌면 CORS_ALLOWED_ORIGINS로 덮어쓴다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://i15a505.p.ssafy.io}
