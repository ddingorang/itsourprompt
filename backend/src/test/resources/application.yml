spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  sql:
    init:
      mode: always
  jooq:
    sql-dialect: POSTGRES
  ai:
    openai:
      api-key: test-api-key
      base-url: https://integrate.api.nvidia.com/v1
      chat:
        model: test-model
        max-tokens: 4096
    model:
      embedding: none
