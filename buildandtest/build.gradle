plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.promptstudio'
version = '0.0.1-SNAPSHOT'
description = 'Code build/run worker'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// 제출 코드의 테스트를 돌리는 런처. 워커 자신의 클래스패스에는 올리지 않는다 —
// 별도 프로세스로 `java -jar`로 띄우므로 컴파일·런타임 의존이 아니라 산출물로만 필요하다.
configurations {
    junitConsole
}

// 신뢰할 수 없는 코드를 실행하는 워커라 표면을 최소로 유지한다.
// web·jpa·security는 필요 없고, AMQP만으로 동작한다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    // AMQP 스타터는 Jackson을 가져오지 않는다. JacksonJsonMessageConverter가 쓰는 Jackson 3을 직접 넣는다.
    implementation 'tools.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 부트 BOM이 관리하지 않는 아티팩트라 버전을 직접 적는다.
    // 워커의 junit-platform-launcher와 같은 버전으로 맞춘다(dependencyInsight로 확인).
    junitConsole 'org.junit.platform:junit-platform-console-standalone:6.0.3'
}

/**
 * 콘솔 런처 팻자를 이미지에 넣을 수 있게 고정된 이름으로 꺼내 놓는다.
 * Dockerfile이 이 경로를 그대로 COPY 한다.
 */
tasks.register('copyJunitConsole', Copy) {
    from configurations.junitConsole
    into layout.buildDirectory.dir('junit-console')
    rename { 'junit-platform-console-standalone.jar' }
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn 'copyJunitConsole'
    // 워커 컨테이너의 /opt/junit 자리를 로컬 테스트에서 대신한다.
    doFirst {
        systemProperty 'worker.junit-console-jar',
                layout.buildDirectory.file('junit-console/junit-platform-console-standalone.jar')
                        .get().asFile.absolutePath
    }
}
