plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.promptstudio'
version = '0.0.1-SNAPSHOT'
description = 'Code build/run worker'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// 신뢰할 수 없는 코드를 실행하는 워커라 표면을 최소로 유지한다.
// web·jpa·security는 필요 없고, AMQP만으로 동작한다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    // AMQP 스타터는 Jackson을 가져오지 않는다. JacksonJsonMessageConverter가 쓰는 Jackson 3을 직접 넣는다.
    implementation 'tools.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
