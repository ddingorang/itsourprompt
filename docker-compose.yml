networks:
  shared-net:
    name: shared-net
    driver: bridge

services:
  postgres:
    image: postgres:18.4
    container_name: promptstudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: promptstudio-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shared-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: promptstudio-rabbitmq
    restart: unless-stopped
    environment:
      # 기본 guest 계정은 loopback에서만 접속 가능하므로 전용 계정을 생성
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 관리 UI (http://localhost:15672)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - shared-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 어템프트 코드를 javac로 컴파일하고 java로 실행하는 워커.
  # 인스턴스를 여러 개 띄운다. run.request의 경쟁 소비자가 되어 RabbitMQ가 라운드로빈으로 분배하고,
  # prefetch=1 · concurrency=1이라 각 워커는 한 번에 한 건만 잡는다.
  # container_name은 두면 복제가 불가능하므로(이름 충돌) 지정하지 않는다.
  buildandtest:
    build: ./buildandtest
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - shared-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Python 문제의 채점 워커. 
  # 워커 애플리케이션은 buildandtest와 같고 실행기·큐만 python
 
  buildandtest-python:
    build:
      context: ./buildandtest
      dockerfile: Dockerfile.python
    restart: unless-stopped
    deploy:
      replicas: 1
    mem_limit: 512m
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - shared-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 릴레이 게임 WebRTC의 TURN 서버
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: promptstudio-coturn
    restart: unless-stopped
    command: >
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --user=${TURN_USER}:${TURN_PASSWORD}
      --realm=promptstudio
      --lt-cred-mech
      --fingerprint
      --no-cli
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # relay 포트 범위. 넓히면 동시 수용량이 늘지만 Docker 포트 매핑이 무거워진다 —
      # 방 6명 mesh 기준 이 범위(41포트)로 충분하다.
      - "49160-49200:49160-49200/udp"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data: