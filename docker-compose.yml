networks:
  shared-net:
    name: shared-net
    driver: bridge

services:
  postgres:
    image: postgres:18.4
    container_name: promptstudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: promptstudio-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shared-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: promptstudio-rabbitmq
    restart: unless-stopped
    environment:
      # 기본 guest 계정은 loopback에서만 접속 가능하므로 전용 계정을 생성
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 관리 UI (http://localhost:15672)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - shared-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 어템프트 코드를 javac로 컴파일하고 java로 실행하는 워커.
  #
  # DB 접속 정보를 주지 않는다. 실행되는 코드가 워커와 같은 컨테이너·같은 uid로 돌기 때문에
  # /proc/1/environ으로 이 환경변수를 읽어낼 수 있고(ProcessBuilder.environment().clear()로도 못 막는다),
  # 워커가 shared-net에 붙어 있어 postgres:5432에 네트워크로 도달할 수도 있다.
  # 즉 여기 없는 값만 확실히 지켜진다 — 아래 RABBITMQ_* 는 필요해서 주는 것이고 획득 가능한 위험을 안는다.
  #
  # 인스턴스를 여러 개 띄운다. run.request의 경쟁 소비자가 되어 RabbitMQ가 라운드로빈으로 분배하고,
  # prefetch=1 · concurrency=1이라 각 워커는 한 번에 한 건만 잡는다.
  # container_name은 두면 복제가 불가능하므로(이름 충돌) 지정하지 않는다.
  buildandtest:
    build: ./buildandtest
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - shared-net
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data: